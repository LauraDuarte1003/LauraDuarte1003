<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070f"/>
      <stop offset="0.55" stop-color="#14062b"/>
      <stop offset="1" stop-color="#2a0a2e"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb000"/>
      <stop offset="1" stop-color="#ff2a6d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f0ff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity="0.28"/>
    </pattern>
    <mask id="sunmask">
      <rect width="1200" height="320" fill="#fff"/>
      <rect x="880" y="212" width="240" height="4" fill="#000"/>
      <rect x="880" y="228" width="240" height="6" fill="#000"/>
      <rect x="880" y="246" width="240" height="8" fill="#000"/>
      <rect x="880" y="266" width="240" height="10" fill="#000"/>
    </mask>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Courier New', Consolas, 'Liberation Mono', monospace; }
    @keyframes glitchA { 0%,91%,100% { transform: translate(0,0); } 92% { transform: translate(-7px,1px); } 94% { transform: translate(5px,-2px); } 96% { transform: translate(-3px,2px); } }
    @keyframes glitchB { 0%,91%,100% { transform: translate(0,0); } 93% { transform: translate(7px,-1px); } 95% { transform: translate(-5px,2px); } 97% { transform: translate(3px,-1px); } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes sweep { from { transform: translateY(-30px); } to { transform: translateY(350px); } }
    .gA { animation: glitchA 4s infinite; }
    .gB { animation: glitchB 4s infinite; }
    .cur { animation: blink 1s steps(1) infinite; }
    .pls { animation: pulse 2.6s ease-in-out infinite; }
    .pls2 { animation: pulse 3.4s ease-in-out infinite; }
    .sweep { animation: sweep 5s linear infinite; }
  </style>

  <!-- Fondo -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Sol neon + skyline -->
  <circle cx="1000" cy="215" r="95" fill="url(#sun)" mask="url(#sunmask)" opacity="0.9"/>
  <g fill="#0a0a1a" stroke="#ff2a6d" stroke-opacity="0.45" stroke-width="1">
    <rect x="820" y="210" width="50" height="110"/>
    <rect x="875" y="170" width="38" height="150"/>
    <rect x="918" y="225" width="60" height="95"/>
    <rect x="985" y="150" width="44" height="170"/>
    <rect x="1034" y="200" width="56" height="120"/>
    <rect x="1095" y="130" width="40" height="190"/>
    <rect x="1140" y="190" width="60" height="130"/>
  </g>
  <g>
    <rect class="pls" x="830" y="225" width="6" height="6" fill="#f5d300"/>
    <rect class="pls2" x="846" y="245" width="6" height="6" fill="#00f0ff"/>
    <rect class="pls2" x="885" y="190" width="6" height="6" fill="#00f0ff"/>
    <rect class="pls" x="897" y="215" width="6" height="6" fill="#f5d300"/>
    <rect class="pls" x="930" y="245" width="6" height="6" fill="#ff2a6d"/>
    <rect class="pls2" x="996" y="175" width="6" height="6" fill="#f5d300"/>
    <rect class="pls" x="1010" y="205" width="6" height="6" fill="#00f0ff"/>
    <rect class="pls2" x="1046" y="225" width="6" height="6" fill="#f5d300"/>
    <rect class="pls" x="1106" y="155" width="6" height="6" fill="#ff2a6d"/>
    <rect class="pls2" x="1106" y="185" width="6" height="6" fill="#00f0ff"/>
    <rect class="pls" x="1155" y="215" width="6" height="6" fill="#f5d300"/>
  </g>

  <!-- Esquinas tipo HUD -->
  <g fill="none" stroke-width="3" filter="url(#glow)">
    <path d="M20 60 V20 H60" stroke="#00f0ff"/>
    <path d="M1180 60 V20 H1140" stroke="#ff2a6d"/>
    <path d="M20 260 V300 H60" stroke="#ff2a6d"/>
    <path d="M1180 260 V300 H1140" stroke="#00f0ff"/>
  </g>

  <!-- Etiqueta superior -->
  <text class="mono" x="60" y="62" font-size="14" fill="#ff2a6d" letter-spacing="3">[ SYSTEM://PROFILE.LOAD ]</text>

  <!-- Titulo con glitch -->
  <g class="mono" font-size="52" font-weight="bold" letter-spacing="3">
    <text class="gA" x="60" y="140" fill="#00f0ff" fill-opacity="0.85">LAURA SOFÍA GUTIÉRREZ</text>
    <text class="gB" x="60" y="140" fill="#ff2a6d" fill-opacity="0.85">LAURA SOFÍA GUTIÉRREZ</text>
    <text x="60" y="140" fill="#ffffff" filter="url(#glow)">LAURA SOFÍA GUTIÉRREZ</text>
  </g>

  <!-- Subtitulo -->
  <text class="mono" x="62" y="186" font-size="22" fill="#00f0ff" letter-spacing="4" filter="url(#glow)">FULL STACK  //  AEM DEVELOPER  //  SECURITY-MINDED</text>

  <!-- Linea separadora -->
  <rect x="62" y="206" width="560" height="2" fill="#ff2a6d" opacity="0.8"/>

  <!-- Terminal -->
  <text class="mono" x="62" y="248" font-size="17" fill="#c9d1d9">
    <tspan fill="#39ff14">root@bogota</tspan><tspan fill="#c9d1d9">:~$ </tspan><tspan fill="#f5d300">status --availability</tspan>
  </text>
  <text class="mono" x="62" y="276" font-size="17" fill="#c9d1d9">
    <tspan fill="#39ff14">&gt; </tspan><tspan fill="#ffffff">OPEN_TO_WORK</tspan><tspan fill="#8b8ba7"> (remote)</tspan>
  </text>
  <rect class="cur" x="330" y="262" width="10" height="18" fill="#00f0ff"/>

  <!-- Overlays: scanlines + barrido -->
  <rect width="1200" height="320" fill="url(#scan)"/>
  <rect class="sweep" x="0" y="0" width="1200" height="14" fill="#00f0ff" opacity="0.06"/>
</svg>
